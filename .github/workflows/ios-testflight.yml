name: iOS → TestFlight

# Compila l'app iOS su un Mac di GitHub e la carica su App Store Connect (TestFlight).
# Non serve un Mac: certificati e profili li gestisce Xcode tramite la chiave API di App Store Connect.
#
# Segreti richiesti (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   Team ID dell'account sviluppatore (10 caratteri, developer.apple.com → Membership)
#   ASC_KEY_ID      Key ID della chiave API di App Store Connect
#   ASC_ISSUER_ID   Issuer ID (stessa pagina delle chiavi)
#   ASC_KEY_P8      contenuto completo del file AuthKey_XXXX.p8 (da -----BEGIN PRIVATE KEY----- a -----END PRIVATE KEY-----)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Controlla i segreti
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Manca il segreto $v"; missing=1; fi
          done
          exit $missing

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web e sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Chiave API App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          # ricostruisce il PEM anche se incollato su una riga sola (capita dal telefono)
          node -e '
            const raw = process.env.ASC_KEY_P8.trim();
            const body = raw.replace(/-----(BEGIN|END) PRIVATE KEY-----/g, "").replace(/[^A-Za-z0-9+/=]/g, "");
            const pem = "-----BEGIN PRIVATE KEY-----\n" + body.match(/.{1,64}/g).join("\n") + "\n-----END PRIVATE KEY-----\n";
            require("fs").writeFileSync(process.argv[1], pem, { mode: 0o600 });
          ' "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Verifica accesso ad App Store Connect
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node -e '
            const crypto = require("crypto"), fs = require("fs");
            const fail = (m) => { console.log("::error title=Chiave API::" + m); process.exit(1); };
            let key;
            try { key = crypto.createPrivateKey(fs.readFileSync(process.env.ASC_KEY_PATH)); }
            catch { fail("Il contenuto di ASC_KEY_P8 non è una chiave .p8 valida: incolla tutto il file, righe BEGIN/END comprese."); }
            const kid = process.env.KEY_ID.trim(), iss = process.env.ISSUER.trim();
            if (!/^[A-Z0-9]{10}$/.test(kid)) fail("ASC_KEY_ID dovrebbe essere di 10 caratteri (lettere maiuscole e cifre). Controlla di non aver invertito Key ID e Issuer ID.");
            if (!/^[0-9a-f-]{36}$/i.test(iss)) fail("ASC_ISSUER_ID dovrebbe essere un UUID (formato 8-4-4-4-12). Controlla di non aver invertito Key ID e Issuer ID.");
            const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
            const now = Math.floor(Date.now() / 1000);
            const data = b64({ alg: "ES256", kid, typ: "JWT" }) + "." + b64({ iss, iat: now, exp: now + 600, aud: "appstoreconnect-v1" });
            const sig = crypto.sign("sha256", Buffer.from(data), { key, dsaEncoding: "ieee-p1363" }).toString("base64url");
            fetch("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=app.ponte.officina", { headers: { Authorization: "Bearer " + data + "." + sig } })
              .then(async (r) => {
                const j = await r.json().catch(() => ({}));
                if (r.status === 401) fail("Apple rifiuta la chiave (401): Key ID, Issuer ID e file .p8 non appartengono alla stessa chiave, oppure la chiave è stata revocata. Usa una chiave del team (non individuale).");
                if (r.status === 403) fail("La chiave non ha i permessi necessari (403): crea una chiave del team con ruolo Admin.");
                if (!r.ok) fail("App Store Connect ha risposto " + r.status + ": " + JSON.stringify(j.errors || j).slice(0, 400));
                if (!j.data || !j.data.length) fail("Chiave valida, ma su App Store Connect non c è nessuna app con ID pacchetto app.ponte.officina: creala in App → Nuova app.");
                console.log("Accesso ok: app trovata (" + j.data[0].attributes.name + ").");
              })
              .catch((e) => fail("Non riesco a contattare App Store Connect: " + e.message));
          '

      - name: Archivia
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD=$(( ${{ github.run_number }} + 100 ))
          echo "Versione $VERSION, build $BUILD"
          # Archivio senza firma: la firma per l'App Store la applica Xcode all'esportazione,
          # con certificato e profilo gestiti nel cloud tramite la chiave API (nessun Mac, nessun certificato da esportare).
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ponte.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" || {
              grep -E "error:|fatal|BUILD FAILED|ARCHIVE FAILED" "$RUNNER_TEMP/archive.log" | sort -u | head -15 | while IFS= read -r l; do echo "::error title=Archivia::${l:0:900}"; done
              exit 1
            }

      - name: Carica su App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Ponte.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            2>&1 | tee "$RUNNER_TEMP/export.log" || {
              grep -iE "error|fail|denied|not found|no .* profile|certificate|forbidden|unauthori" "$RUNNER_TEMP/export.log" | sort -u | head -15 | while IFS= read -r l; do echo "::error title=Carica::${l:0:900}"; done
              exit 1
            }

      - name: Pulizia
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
