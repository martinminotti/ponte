name: iOS simulatore

# Prova l'app sul simulatore iOS: barra nativa, ricerca, scheda, fogli, tema scuro, testo grande.
# Screenshot, video e risultati finiscono sul branch "ci-sim" (sovrascritto a ogni giro).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-sim
  cancel-in-progress: true

jobs:
  sim:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: idb
        run: |
          brew tap facebook/fb
          brew trust facebook/fb || true
          brew install facebook/fb/idb-companion
          pip install fb-idb

      - name: Build web e sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Compila per il simulatore
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*Swift|BUILD" || true
          test -d "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app" || {
            grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -20 | while IFS= read -r l; do echo "::error title=Compila::${l:0:900}"; done
            exit 1
          }

      - name: Avvia il simulatore
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          best=None
          for rt,devs in d.items():
              if 'iOS' not in rt: continue
              for x in devs:
                  if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']:
                      best=(rt,x)
          print(best[1]['udid'])
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # una sessione grafica del Simulatore: senza, il servizio di accessibilità (idb ui) non vede l'app in primo piano
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 8
          NAME=$(xcrun simctl list devices -j | python3 -c "import json,sys;print([x['name']+' · '+k.split('.')[-1] for k,v in json.load(sys.stdin)['devices'].items() for x in v if x['udid']=='$UDID'][0])")
          echo "::notice title=Simulatore::$NAME"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl privacy "$UDID" grant camera app.ponte.officina || true
          echo "$NAME" > "$RUNNER_TEMP/device.txt"

      - name: Scenario
        run: python3 .github/sim/drive.py "${{ steps.sim.outputs.udid }}" "$RUNNER_TEMP/out"

      - name: Registri dell'app
        if: always()
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          U="${{ steps.sim.outputs.udid }}"
          xcrun simctl spawn "$U" log show --last 10m --info --debug --style compact --predicate 'process == "App" OR process == "com.apple.WebKit.WebContent"' > "$OUT/log-app.txt" 2>&1 || true
          tail -c 400000 "$OUT/log-app.txt" > "$OUT/log-app-tail.txt" || true
          grep -iE "⚡️|error|exception|fatal|crash|capacitor" "$OUT/log-app.txt" | tail -300 > "$OUT/log-filtrato.txt" || true
          mkdir -p "$OUT/crash"; cp ~/Library/Logs/DiagnosticReports/App* "$OUT/crash/" 2>/dev/null || true
          xcrun simctl spawn "$U" launchctl list 2>/dev/null | grep -i ponte > "$OUT/processi.txt" || true

      - name: Pubblica i risultati su ci-sim
        if: always()
        run: |
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          cp "$RUNNER_TEMP/device.txt" "$OUT/" 2>/dev/null || true
          echo "${{ github.sha }}" > "$OUT/commit.txt"
          cd "$OUT"
          git init -q -b ci-sim
          git config user.name "Ponte CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Simulatore: ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-sim
          grep -c "❌" risultati.md && echo "::warning title=Simulatore::$(grep -c '❌' risultati.md) controlli non superati" || true
