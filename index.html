<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Ponte</title>
    <meta name="description" content="Ponte, il registro dell'officina. Gestionale per officine meccaniche, elettrauti e gommisti: accettazione veicoli, stato lavori su WhatsApp, conto, fatture e pagamenti." />
    <meta name="theme-color" content="#EDEDEB" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ponte" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      // tema prima del primo disegno, per evitare il lampo bianco in modalità scura
      try {
        var t = localStorage.getItem('ro:theme');
        if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ponte ha bisogno di JavaScript attivo.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
