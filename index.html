<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro Officina</title>
<meta name="theme-color" content="#1B4FA3">
<meta name="description" content="Gestionale per officine meccaniche, elettrauti e gommisti: accettazione veicoli, stato lavori su WhatsApp, conto, fatture e pagamenti.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Officina">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* base: normalizzazione minima */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { min-height: 100%; }
body { margin: 0; font: 14px system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una colonna da telefono. Elenco di schede lavoro, ognuna con la targa a placca (fascia blu UE) come elemento fisso; dettaglio a sezioni impilate: stato, WhatsApp, lavori e totale, garanzia, pagamento. */
:root {
  --bg: #E8ECF0;
  --surface: #FFFFFF;
  --surface-2: #F2F5F8;
  --ink: #121C26;
  --ink-2: #47576A;
  --line: #CFD7E0;
  --accent: #1B4FA3;
  --accent-ink: #FFFFFF;
  --accent-soft: #DAE5F6;
  --wa: #117A3D;
  --wa-ink: #FFFFFF;
  --danger: #B3261E;
  --danger-soft: #FBE3E1;
  --warn-soft: #FBEFD0;
  --warn-ink: #5E4100;
  --st-accettato-bg: #E1E6EB; --st-accettato-fg: #35424F;
  --st-diagnosi-bg: #FBE9BE; --st-diagnosi-fg: #6A4600;
  --st-ricambi-bg: #FAD8C5; --st-ricambi-fg: #7B2D08;
  --st-lavorazione-bg: #D3E2F8; --st-lavorazione-fg: #10408A;
  --st-pronto-bg: #CDEED8; --st-pronto-fg: #0D5A2A;
  --st-consegnato-bg: #E1E6EB; --st-consegnato-fg: #35424F;
  --f-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151D;
    --surface: #17212C;
    --surface-2: #1D2A37;
    --ink: #E8EDF2;
    --ink-2: #9DAABA;
    --line: #2C3A49;
    --accent: #78A9F7;
    --accent-ink: #0A1830;
    --accent-soft: #1B2E4B;
    --wa: #2FBF71;
    --wa-ink: #05200F;
    --danger: #FF9087;
    --danger-soft: #4A1F1C;
    --warn-soft: #43361A;
    --warn-ink: #F3D88E;
    --st-accettato-bg: #26323F; --st-accettato-fg: #BCC8D4;
    --st-diagnosi-bg: #4A3A12; --st-diagnosi-fg: #F6D58A;
    --st-ricambi-bg: #51291A; --st-ricambi-fg: #F5BFA2;
    --st-lavorazione-bg: #1B3358; --st-lavorazione-fg: #AECBF8;
    --st-pronto-bg: #16432A; --st-pronto-fg: #9DE0B7;
    --st-consegnato-bg: #26323F; --st-consegnato-fg: #BCC8D4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151D;
  --surface: #17212C;
  --surface-2: #1D2A37;
  --ink: #E8EDF2;
  --ink-2: #9DAABA;
  --line: #2C3A49;
  --accent: #78A9F7;
  --accent-ink: #0A1830;
  --accent-soft: #1B2E4B;
  --wa: #2FBF71;
  --wa-ink: #05200F;
  --danger: #FF9087;
  --danger-soft: #4A1F1C;
  --warn-soft: #43361A;
  --warn-ink: #F3D88E;
  --st-accettato-bg: #26323F; --st-accettato-fg: #BCC8D4;
  --st-diagnosi-bg: #4A3A12; --st-diagnosi-fg: #F6D58A;
  --st-ricambi-bg: #51291A; --st-ricambi-fg: #F5BFA2;
  --st-lavorazione-bg: #1B3358; --st-lavorazione-fg: #AECBF8;
  --st-pronto-bg: #16432A; --st-pronto-fg: #9DE0B7;
  --st-consegnato-bg: #26323F; --st-consegnato-fg: #BCC8D4;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--f-body);
  padding-block: 0 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
.wrap { max-width: 760px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.mono { font-family: var(--f-mono); font-size: 14px; letter-spacing: .02em; }
.pad { padding: 24px 0; text-align: center; }

/* intestazione */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 11;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 12px 10px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-t { min-width: 0; }
.brand h1 {
  margin: 0;
  font: 700 28px/1 var(--f-display);
  letter-spacing: .02em;
  text-transform: uppercase;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.brand p { margin: 3px 0 0; font-size: 14px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* bottoni */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink);
  font-weight: 600; cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.wa { background: var(--wa); border-color: var(--wa); color: var(--wa-ink); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.btn.block { width: 100%; }
.btn.lg { min-height: 54px; font-size: 18px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.icon-btn {
  display: inline-grid; place-items: center; width: 46px; height: 46px; flex: none;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer;
}
.icon-btn:hover { border-color: var(--ink-2); }
.row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.grow { flex: 1 1 160px; }

/* ricerca e filtri */
.search { position: relative; margin-top: 12px; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-2); pointer-events: none; }
.search input {
  width: 100%; min-height: 52px; padding: 0 14px 0 44px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
}
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 8px;
  min-height: 40px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  font-weight: 500; cursor: pointer;
}
.chip b { font: 600 14px var(--f-body); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] b { color: inherit; }

/* targa */
.plate {
  display: inline-flex; height: 34px; background: #fff; border: 2px solid #111; border-radius: 6px; overflow: hidden; flex: none;
}
.plate i {
  display: grid; place-items: center; width: 22px; background: #1A3FA0; color: #fff;
  font: 700 12px var(--f-display); font-style: normal;
}
.plate b {
  display: grid; place-items: center; padding: 0 10px; color: #111;
  font: 700 23px/1 var(--f-display); letter-spacing: .07em; white-space: nowrap;
}
.plate.lg { height: 50px; border-radius: 8px; }
.plate.lg i { width: 30px; font-size: 15px; }
.plate.lg b { font-size: 34px; padding: 0 14px; }
.plate.empty b { color: #777; }

/* stato */
.pill {
  display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px;
  border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap;
}
.pill[data-s="accettato"] { background: var(--st-accettato-bg); color: var(--st-accettato-fg); }
.pill[data-s="diagnosi"] { background: var(--st-diagnosi-bg); color: var(--st-diagnosi-fg); }
.pill[data-s="ricambi"] { background: var(--st-ricambi-bg); color: var(--st-ricambi-fg); }
.pill[data-s="lavorazione"] { background: var(--st-lavorazione-bg); color: var(--st-lavorazione-fg); }
.pill[data-s="pronto"] { background: var(--st-pronto-bg); color: var(--st-pronto-fg); }
.pill[data-s="consegnato"] { background: var(--st-consegnato-bg); color: var(--st-consegnato-fg); }

/* elenco */
.list { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.job {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; align-items: center;
  width: 100%; text-align: left; padding: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
}
.job:hover { border-color: var(--ink-2); }
.job .meta, .job .foot { grid-column: 1 / -1; display: flex; gap: 4px 12px; flex-wrap: wrap; justify-content: space-between; min-width: 0; }
.job .meta strong { font-weight: 600; }
.job .meta span { color: var(--ink-2); }
.job .foot { font-size: 14px; color: var(--ink-2); }
.due { color: var(--danger); font-weight: 600; font-variant-numeric: tabular-nums; }
.ok { color: var(--st-pronto-fg); font-weight: 600; }
.sumline { margin: 8px 0 0; font-size: 14px; color: var(--ink-2); }
.sumline b { color: var(--ink); font-variant-numeric: tabular-nums; }
.banner {
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn-ink); font-size: 14px;
}
.banner .btn { min-height: 38px; background: transparent; border-color: currentColor; color: inherit; }
.empty-state { margin-top: 16px; padding: 28px 18px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.empty-state p { margin: 0 0 14px; }

/* barra dettaglio */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 6px; }
.sync { font-size: 14px; color: var(--ink-2); }
.sync.bad { color: var(--danger); font-weight: 600; }
.page-title { margin: 8px 0 12px; font: 700 30px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }

/* schede dettaglio */
.card { margin-top: 12px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; gap: 14px; }
.card h3 { margin: 0; font: 600 14px var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.card.hot { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.veh { margin: 0; font: 600 26px/1.1 var(--f-display); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 16px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 13px; color: var(--ink-2); }
.facts dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.req { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.req strong { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { padding: 2px 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; }

.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 620px) { .steps { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.step {
  min-height: 56px; padding: 6px 4px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface-2); font-weight: 500; font-size: 15px; line-height: 1.15; cursor: pointer; text-align: center;
}
.step[data-state="done"] { background: var(--accent-soft); border-color: transparent; }
.step[data-state="done"]::before { content: "\2713\00a0"; }
.step[data-state="current"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
details.hist summary { cursor: pointer; font-size: 14px; color: var(--ink-2); min-height: 32px; }
details.hist ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }

/* campi */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .lab { font-size: 14px; font-weight: 500; color: var(--ink-2); }
input[type="text"], input[type="tel"], input[type="date"], input[type="search"], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink);
}
textarea { resize: vertical; line-height: 1.4; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--accent); }
.err { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--danger-soft); color: var(--danger); font-weight: 500; }
.note { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
.note.warn { background: var(--warn-soft); color: var(--warn-ink); }
.found { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px; border-radius: 10px; background: var(--accent-soft); font-size: 15px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* lavori e totale */
.item { display: grid; grid-template-columns: minmax(0, 1fr) 104px 46px; gap: 8px; align-items: center; }
.items { display: flex; flex-direction: column; gap: 8px; }
.item input.amt { text-align: right; font-variant-numeric: tabular-nums; }
dl.tot { margin: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
dl.tot div { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
dl.tot dt { color: var(--ink-2); }
dl.tot dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 500; }
dl.tot .big dt { color: var(--ink); font-weight: 600; }
dl.tot .big dd { font: 700 34px/1 var(--f-display); }
.paidmsg { margin: 0; padding: 12px; border-radius: 10px; background: var(--st-pronto-bg); color: var(--st-pronto-fg); font-weight: 600; }

ul.others { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
ul.others button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-height: 46px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); cursor: pointer; }

.plate.rsm i { width: 36px; font-size: 10px; letter-spacing: .04em; }
.plate.lg.rsm i { width: 48px; font-size: 13px; }
.logo { display: grid; place-items: center; width: 44px; height: 44px; flex: none; padding: 4px; background: #fff; color: #47576A; border: 1px solid var(--line); border-radius: 10px; }
.logo img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
.logo.big { width: 84px; height: 84px; padding: 6px; text-align: center; }
.swatches { display: flex; flex-wrap: wrap; gap: 12px; }
.sw { position: relative; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 3px solid var(--surface); background: var(--c); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.sw[aria-pressed="true"], .sw.on { box-shadow: 0 0 0 3px var(--ink); }
.sw.custom { background: conic-gradient(#e53935, #fdd835, #43a047, #1e88e5, #8e24aa, #e53935); }
.sw.custom.on { background: var(--c); }
.sw.custom input { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; opacity: 0; cursor: pointer; }
.sw.custom:focus-within { outline: 3px solid var(--accent); outline-offset: 3px; }
.logo-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.logo-btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); opacity: 0; }
.vh:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.wlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.wlist li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 4px 4px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.addrow input { flex: 1 1 160px; width: auto; }

.paper { --pa: #1B4FA3; margin-top: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; background: #fff; color: #1A2028; border: 1px solid var(--line); border-top: 6px solid var(--pa); border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, .10); font-size: 14px; }
.paper p { margin: 0; overflow-wrap: anywhere; }
.paper h4 { margin: 0 0 2px; font: 700 11px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--pa); }
.p-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; padding-bottom: 14px; border-bottom: 1px solid #D2D8DF; }
.p-logo { display: grid; place-items: center; width: 56px; height: 56px; flex: none; }
.p-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.p-shop { flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; }
.p-shop strong { font: 700 22px/1.1 var(--f-display); text-transform: uppercase; overflow-wrap: anywhere; }
.p-shop span, .p-mut { color: #66707C; font-size: 13px; }
.p-title { display: flex; flex-direction: column; text-align: right; font-size: 13px; color: #66707C; }
.p-title b { font: 700 21px/1 var(--f-display); letter-spacing: .04em; color: var(--pa); }
.p-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.p-grid section { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0; padding: 12px 14px; background: #F4F6F9; border-radius: 8px; }
.p-big { font: 600 19px/1.15 var(--f-display); }
.p-wrap { overflow-x: auto; }
.p-table { width: 100%; border-collapse: collapse; }
.p-table th { padding: 8px 10px; background: var(--pa); color: #fff; font-weight: 600; text-align: left; }
.p-table td { padding: 9px 10px; border-bottom: 1px solid #E3E8ED; vertical-align: top; }
.p-table th:last-child, .p-table td:last-child { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.p-table tbody tr:nth-child(even) td { background: #F8F9FB; }
.p-tot { align-self: flex-end; width: min(100%, 320px); margin: 0; display: flex; flex-direction: column; gap: 6px; }
.p-tot div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.p-tot dd { margin: 0; font-variant-numeric: tabular-nums; }
.p-tot .big { padding-top: 8px; border-top: 1px solid #D2D8DF; }
.p-tot .big dt { font-weight: 600; }
.p-tot .big dd { font: 700 30px/1 var(--f-display); color: var(--pa); }
.p-foot { padding-top: 12px; border-top: 1px solid #D2D8DF; font-size: 12px; color: #66707C; text-align: center; }

.newrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }

.mj-t { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.mj-a { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.p-table .p-grp td { background: #E8EDF4; font-weight: 600; text-align: left; white-space: normal; }
.p-sub td { font-style: italic; color: #66707C; font-size: 13px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

<body>

</div>

  <option value="Frizione"></option>
  <option value="Diagnosi elettronica"></option>
  <option value="Batteria"></option>
  <option value="Alternatore"></option>
  <option value="Motorino avviamento"></option>
  <option value="Cambio gomme (4)"></option>
  <option value="Equilibratura"></option>
  <option value="Convergenza"></option>
  <option value="Riparazione foratura"></option>
  <option value="Ricarica climatizzatore"></option>
  <option value="Mano d'opera"></option>
  <option value="Ricambi"></option>
</datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function () {
  'use strict';

  var STATI = [
    { k: 'accettato', l: 'Accettato' },
    { k: 'diagnosi', l: 'In diagnosi' },
    { k: 'ricambi', l: 'Attesa ricambi' },
    { k: 'lavorazione', l: 'In lavorazione' },
    { k: 'pronto', l: 'Pronto' },
    { k: 'consegnato', l: 'Consegnato' }
  ];
  var SERVIZI = ['Meccanica', 'Elettrauto', 'Gomme', 'Altro'];
  var PAGAMENTI = ['Contanti', 'Carta / POS', 'Bonifico', 'Assegno', 'Altro'];
  var GARANZIE = [
    { m: 0, l: 'Nessuna' }, { m: 3, l: '3 mesi' }, { m: 6, l: '6 mesi' }, { m: 12, l: '12 mesi' }, { m: 24, l: '24 mesi' }
  ];
  var FILTRI = [['tutti', 'Tutti'], ['officina', 'In officina'], ['pronti', 'Pronti'], ['saldo', 'Da saldare'], ['fatturare', 'Da fatturare'], ['chiusi', 'Chiusi']];
  var LSK = 'registro-officina-v1';

  var eur = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
  var app = document.getElementById('app');

  var ICON = {
    search: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
    plus: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    back: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    sliders: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>',
    chat: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
  };
  document.getElementById('btn-settings').innerHTML = ICON.sliders;

  /* ---------- stato dell'app ---------- */
  var jobs = [];
  var settings = { shop: '', prefix: '39', warranty: 12, vat: 22, accent: '#1B4FA3', logo: '', workers: [] };
  var ready = false;
  var mode = 'cloud';
  var loadError = false;
  var dbh = null;
  var view = { n: 'list' };
  var filter = 'tutti';
  var q = '';
  var cur = null;
  var saveT = null, saving = false, again = false, savingP = null;

  /* ---------- utilità ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  }
  function $(id) { return document.getElementById(id); }
  function uid() { return 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function statoLabel(k) { for (var i = 0; i < STATI.length; i++) if (STATI[i].k === k) return STATI[i].l; return k; }
  function fmtPlate(p, cc) {
    if (cc === 'RSM') return String(p || '').toUpperCase().trim().replace(/\s+/g, ' ');
    var s = String(p || '').toUpperCase().replace(/\s+/g, '');
    var m = s.match(/^([A-Z]{2})(\d{3})([A-Z]{2})$/);
    return m ? m[1] + ' ' + m[2] + ' ' + m[3] : s;
  }
  function plateHTML(p, lg, cc) {
    var t = fmtPlate(p, cc), sm = cc === 'RSM';
    return '<span class="plate' + (lg ? ' lg' : '') + (sm ? ' rsm' : '') + (t ? '' : ' empty') + '" role="img" aria-label="Targa ' + (sm ? 'di San Marino ' : '') + esc(t || 'non indicata') + '"><i>' + (sm ? 'RSM' : 'I') + '</i><b>' + esc(t || '— — —') + '</b></span>';
  }
  function fmtDate(ts) { return new Date(ts).toLocaleDateString('it-IT'); }
  function fmtDay(ts) { return new Date(ts).toLocaleDateString('it-IT', { day: 'numeric', month: 'short' }); }
  function fmtDateTime(ts) {
    return new Date(ts).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function fmtIsoDay(s) { var p = String(s || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }
  function parseAmount(v) {
    var s = String(v == null ? '' : v).trim().replace(/[€\s]/g, '');
    if (!s) return 0;
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    var n = parseFloat(s);
    return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0;
  }
  function fmtInput(n) { return n ? String(n).replace('.', ',') : ''; }
  function veic(j) { return [j.make, j.model].filter(Boolean).join(' ') || 'Veicolo'; }
  function isAz(j) { return j && j.client === 'azienda'; }
  function custName(j) { return isAz(j) ? ((j.company && j.company.name) || j.owner || '') : (j.owner || ''); }
  var VATS = [22, 17, 10, 4, 0];
  function rateOf(j) { return j.vatRate == null ? (settings.vat == null ? 22 : Number(settings.vat)) : Number(j.vatRate); }
  function r2(n) { return Math.round(n * 100) / 100; }
  function itemsSum(j) {
    var t = 0; (j.items || []).forEach(function (i) { t += Number(i.amount) || 0; });
    return r2(t);
  }
  function calc(j) {
    var s = itemsSum(j);
    if (!isAz(j)) return { net: s, vat: 0, gross: s, rate: 0 };
    var r = rateOf(j) / 100, net, vat, gross;
    if (j.vatIncl === false) { net = s; vat = r2(s * r); gross = r2(net + vat); }
    else { gross = s; net = r2(s / (1 + r)); vat = r2(gross - net); }
    return { net: net, vat: vat, gross: gross, rate: rateOf(j) };
  }
  function totale(j) { return calc(j).gross; }
  function daSaldare(j) {
    if (j.paid) return 0;
    return Math.max(0, Math.round((totale(j) - (Number(j.deposit) || 0)) * 100) / 100);
  }
  function isDue(j) {
    return !j.paid && !monthlyPending(j) && (j.status === 'pronto' || j.status === 'consegnato') && daSaldare(j) > 0;
  }
  function scadenza(j) {
    var b = new Date(j.deliveredAt || j.closedAt || Date.now());
    b.setMonth(b.getMonth() + (j.warrantyMonths || 0));
    return b.getTime();
  }
  function waNumber(p) {
    var raw = String(p || '').trim();
    if (!raw) return '';
    var d = raw.replace(/[^\d+]/g, '');
    if (d.charAt(0) === '+') return d.slice(1).replace(/\D/g, '');
    d = d.replace(/\D/g, '');
    if (!d) return '';
    if (d.indexOf('00') === 0) return d.slice(2);
    var pre = settings.prefix || '39';
    if (d.indexOf(pre) === 0 && d.length >= 11) return d;
    return pre + d;
  }
  function touch() { if (cur) cur.updatedAt = Date.now(); }

  /* ---------- aspetto: colore e logo ---------- */
  var PRESETS = [
    { n: 'Blu', c: '#1B4FA3' }, { n: 'Rosso', c: '#B3261E' }, { n: 'Verde', c: '#1E7A43' },
    { n: 'Arancio', c: '#C25A00' }, { n: 'Turchese', c: '#0E7C86' }, { n: 'Viola', c: '#6A3FA0' }, { n: 'Grafite', c: '#3A4654' }
  ];
  function okHex(h) { return /^#[0-9a-fA-F]{6}$/.test(String(h || '')); }
  function hexToRgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgbToHex(c) { return '#' + c.map(function (v) { return ('0' + Math.round(v).toString(16)).slice(-2); }).join(''); }
  function lum(c) {
    var a = c.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
  }
  function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function inkFor(c) { var L = lum(c); return 1.05 / (L + 0.05) >= (L + 0.05) / 0.058 ? '#FFFFFF' : '#0B1520'; }
  function applyBrand(hex) {
    if (!okHex(hex)) hex = '#1B4FA3';
    var rgb = hexToRgb(hex), white = [255, 255, 255], dk = rgb;
    for (var t = 0; t <= 1 && lum(dk) < 0.25; t += 0.05) dk = mixc(rgb, white, t);
    var light = '--accent:' + hex + ';--accent-ink:' + inkFor(rgb) + ';--accent-soft:' + rgbToHex(mixc(rgb, white, 0.86)) + ';';
    var dark = '--accent:' + rgbToHex(dk) + ';--accent-ink:' + inkFor(dk) + ';--accent-soft:' + rgbToHex(mixc(dk, [23, 33, 44], 0.82)) + ';';
    var st = document.getElementById('brand-css');
    if (!st) { st = document.createElement('style'); st.id = 'brand-css'; document.head.appendChild(st); }
    st.textContent = ':root{' + light + '}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){' + dark + '}}:root[data-theme="dark"]{' + dark + '}';
  }
  function renderHeader() {
    var name = $('brand-name'), sub = $('brand-sub'), lg = $('logo');
    if (settings.shop) { name.textContent = settings.shop; sub.textContent = 'Registro Officina'; sub.hidden = false; }
    else { name.textContent = 'Registro Officina'; sub.textContent = ''; sub.hidden = true; }
    if (settings.logo) { lg.querySelector('img').src = settings.logo; lg.hidden = false; } else { lg.hidden = true; }
    applyBrand(settings.accent);
  }
  function readLogo(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error('read')); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('img')); };
        img.onload = function () {
          if (!img.width || !img.height) { reject(new Error('size')); return; }
          var sizes = [256, 160, 96], out = '';
          for (var i = 0; i < sizes.length; i++) {
            var sc = Math.min(1, sizes[i] / Math.max(img.width, img.height));
            var w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
            var c = document.createElement('canvas'); c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            out = c.toDataURL('image/png');
            if (out.length > 120000) {
              var c2 = document.createElement('canvas'); c2.width = w; c2.height = h;
              var x2 = c2.getContext('2d'); x2.fillStyle = '#fff'; x2.fillRect(0, 0, w, h); x2.drawImage(img, 0, 0, w, h);
              out = c2.toDataURL('image/jpeg', 0.85);
            }
            if (out.length <= 120000) break;
          }
          if (out.length > 200000) reject(new Error('big')); else resolve(out);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function setSync(t, bad) {
    var el = $('sync'); if (!el) return;
    el.textContent = t; el.className = 'sync' + (bad ? ' bad' : '');
  }

  /* ---------- messaggi WhatsApp ---------- */
  function riepilogo(j) {
    var t = '';
    var items = (j.items || []).filter(function (i) { return i.desc || i.amount; });
    if (items.length) {
      t += '\n\nLavori eseguiti:\n' + items.map(function (i) {
        return '• ' + (i.desc || 'Voce') + ' – ' + eur.format(Number(i.amount) || 0);
      }).join('\n');
    }
    var tot = totale(j);
    if (tot > 0) {
      if (isAz(j)) { var cc = calc(j); t += '\n\nImponibile: ' + eur.format(cc.net) + '\nIVA ' + cc.rate + '%: ' + eur.format(cc.vat); }
      t += (isAz(j) ? '\n' : '\n\n') + 'Totale: ' + eur.format(tot);
      if (j.deposit > 0) t += '\nAcconto versato: ' + eur.format(j.deposit);
      t += j.paid ? '\nPagato' + (j.payMethod ? ' (' + j.payMethod + ')' : '') + '.' : monthlyPending(j) ? '\nSarà incluso nella fattura di fine mese.' : '\nDa saldare: ' + eur.format(daSaldare(j));
    }
    if (j.warrantyMonths > 0) {
      t += '\n\nGaranzia sui lavori: ' + j.warrantyMonths + ' mesi, fino al ' + fmtDate(scadenza(j)) + '.';
      if (j.warrantyNote) t += ' ' + j.warrantyNote + '.';
    }
    return t;
  }
  function buildMsg(j, kind) {
    var sh = settings.shop || '', v = veic(j) + (j.plate ? ' (' + fmtPlate(j.plate, j.plateCountry) + ')' : '');
    var hi = ('Buongiorno ' + (j.owner || (isAz(j) && j.company ? j.company.name : '') || '')).trim() + ',';
    var T = {
      accettato: hi + ' abbiamo preso in carico ' + v + ' il ' + fmtDate(j.createdAt) + '. Ti aggiorniamo noi sullo stato dei lavori.',
      diagnosi: hi + ' ' + v + ' è in diagnosi: stiamo controllando e ti diciamo presto cosa serve.',
      ricambi: hi + ' per ' + v + ' siamo in attesa dei ricambi. Appena arrivano riprendiamo i lavori.',
      lavorazione: hi + ' sono iniziati i lavori su ' + v + '.',
      pronto: hi + ' ' + v + ' e il conto sono pronti. Puoi passare a ritirare.' + riepilogo(j),
      consegnato: hi + (sh ? ' grazie per aver scelto ' + sh : ' grazie per averci scelto') + '. Ecco il riepilogo dei lavori su ' + v + '.' + riepilogo(j)
    };
    return (T[kind] || T.accettato) + (sh ? '\n\n' + sh : '');
  }

  /* ---------- archivio ---------- */
  function loadLocal() {
    try {
      var d = JSON.parse(localStorage.getItem(LSK) || 'null');
      if (d) { jobs = d.jobs || []; settings = Object.assign(settings, d.settings || {}); }
    } catch (e) { /* archivio locale non leggibile */ }
    jobs.sort(function (a, b) { return b.createdAt - a.createdAt; });
  }
  function saveLocal() { localStorage.setItem(LSK, JSON.stringify({ jobs: jobs, settings: settings })); }

  function persist(job) {
    var body = clone(job);
    if (dbh) return dbh.doc('jobs/' + job.id).set(body);
    var i = -1;
    for (var k = 0; k < jobs.length; k++) if (jobs[k].id === job.id) { i = k; break; }
    if (i >= 0) jobs[i] = body; else jobs.unshift(body);
    jobs.sort(function (a, b) { return b.createdAt - a.createdAt; });
    saveLocal();
    return Promise.resolve();
  }
  function removeJob(id) {
    if (dbh) return dbh.doc('jobs/' + id).delete();
    jobs = jobs.filter(function (j) { return j.id !== id; });
    saveLocal();
    return Promise.resolve();
  }
  function persistSettings() {
    if (dbh) return dbh.doc('settings/main').set(clone(settings));
    saveLocal();
    return Promise.resolve();
  }
  function queueSave() {
    setSync('Salvataggio…');
    clearTimeout(saveT);
    saveT = setTimeout(flush, 500);
  }
  function flush() {
    clearTimeout(saveT); saveT = null;
    if (!cur) return Promise.resolve();
    if (saving) { again = true; return savingP; }
    var job = cur;
    saving = true;
    savingP = (async function () {
      try {
        do { again = false; await persist(job); } while (again);
        setSync('Salvato');
      } catch (e) {
        setSync('Non salvato. Riprova.', true);
      } finally { saving = false; }
    })();
    return savingP;
  }

  async function init() {
    render();
    var db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (db) {
      dbh = db; mode = 'cloud';
      try {
        db.collection('jobs').orderBy('createdAt', 'desc').limit(1000).onSnapshot(function (snap) {
          jobs = snap.docs.map(function (d) { var o = d.data(); o.id = d.id; return o; });
          ready = true; loadError = false;
          if (view.n === 'list') updateResults(); else if (view.n === 'month') updateMonth();
        }, function () { ready = true; loadError = true; if (view.n === 'list') updateResults(); });
        db.doc('settings/main').onSnapshot(function (s) {
          if (s.exists) settings = Object.assign(settings, s.data());
          renderHeader();
        }, function () {});
      } catch (e) { ready = true; loadError = true; updateResults(); }
    } else {
      mode = 'local'; loadLocal(); ready = true; render();
    }
  }

  /* ---------- navigazione ---------- */
  function go(v) { view = v; window.scrollTo(0, 0); render(); }
  function render() {
    renderHeader();
    if (view.n === 'list') renderList();
    else if (view.n === 'form') renderForm();
    else if (view.n === 'detail') renderDetail();
    else if (view.n === 'settings') renderSettings();
    else if (view.n === 'doc') renderDoc();
    else if (view.n === 'month') renderMonth();
  }
  function showDetail(extra) {
    view = Object.assign({ n: 'detail', id: cur.id, hot: false, kind: cur.status, waDirty: false, confirmDel: false }, extra || {});
    window.scrollTo(0, 0); render();
  }
  function openJob(id) {
    var j = null; jobs.forEach(function (x) { if (x.id === id) j = x; });
    if (!j) return;
    cur = clone(j); cur.items = cur.items || []; cur.history = cur.history || [];
    showDetail();
  }

  /* ---------- elenco ---------- */
  function renderList() {
    app.innerHTML =
      '<p class="lab-top">Nuova accettazione</p><div class="newrow"><button class="btn primary lg" type="button" data-act="new" data-cl="privato">' + ICON.plus + '<span>Privato</span><small>nessuna fattura</small></button><button class="btn primary lg" type="button" data-act="new" data-cl="azienda">' + ICON.plus + '<span>Azienda</span><small>con fattura</small></button></div><button class="btn block" type="button" data-act="month">Fattura mensile ditta</button>' +
      '<div class="search">' + ICON.search + '<input id="q" data-f="q" type="search" inputmode="search" autocomplete="off" spellcheck="false" placeholder="Cerca targa, telaio o proprietario" aria-label="Cerca per targa, telaio o proprietario" value="' + esc(q) + '"></div>' +
      '<div class="chips" id="chips" role="group" aria-label="Filtra per stato"></div>' +
      '<div id="demo"></div><div id="sum"></div><div id="results" class="list"></div>';
    updateResults();
  }
  function matchJob(j) {
    var toks = q.trim().split(/\s+/).filter(Boolean);
    if (!toks.length) return true;
    var hay = [j.plate, j.vin, j.owner, j.phone, j.make, j.model, (j.workers || []).join(' '), j.company ? [j.company.name, j.company.vat, j.company.cf].join(' ') : ''].map(norm).join(' ');
    return toks.every(function (t) { var n = norm(t); return !n || hay.indexOf(n) >= 0; });
  }
  function inFilter(j, f) {
    if (f === 'officina') return j.status !== 'pronto' && j.status !== 'consegnato';
    if (f === 'pronti') return j.status === 'pronto';
    if (f === 'saldo') return isDue(j);
    if (f === 'fatturare') return isAz(j) && (j.status === 'pronto' || j.status === 'consegnato') && !j.invoiced;
    if (f === 'chiusi') return j.status === 'consegnato' && !isDue(j);
    return true;
  }
  function cardHTML(j) {
    var right;
    if (isDue(j)) right = '<span class="due">Da saldare ' + eur.format(daSaldare(j)) + '</span>';
    else if (j.paid) right = '<span class="ok">Pagato ' + eur.format(totale(j)) + '</span>';
    else if (totale(j) > 0) right = '<span>' + eur.format(totale(j)) + '</span>';
    else right = '';
    var srv = (j.services || []).join(' · ');
    return '<button type="button" class="job" data-act="open" data-id="' + esc(j.id) + '">' +
      plateHTML(j.plate, false, j.plateCountry) +
      '<span class="pill" data-s="' + esc(j.status) + '">' + esc(statoLabel(j.status)) + '</span>' +
      '<span class="meta"><strong>' + esc(veic(j)) + '</strong><span>' + (isAz(j) ? 'Azienda · ' : '') + esc(custName(j) || '—') + '</span></span>' +
      '<span class="foot"><span>' + (srv ? esc(srv) + ' · ' : '') + 'entrato ' + esc(fmtDay(j.createdAt)) + ((j.workers || []).length ? ' · ' + esc(j.workers.join(', ')) : '') + (isAz(j) && (j.status === 'pronto' || j.status === 'consegnato') && !j.invoiced ? ' · da fatturare' : '') + '</span>' + right + '</span>' +
      '</button>';
  }
  function updateResults() {
    var el = $('results'); if (!el) return;
    $('chips').innerHTML = FILTRI.map(function (f) {
      var n = jobs.filter(function (j) { return inFilter(j, f[0]); }).length;
      return '<button type="button" class="chip" data-act="filter" data-v="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + ' <b>' + n + '</b></button>';
    }).join('');
    var demoN = jobs.filter(function (j) { return j.demo; }).length;
    $('demo').innerHTML = demoN
      ? '<div class="banner"><span>Le schede con dati inventati servono da esempio.</span><button type="button" class="btn" data-act="removedemo">Elimina esempi</button></div>'
      : '';
    if (!ready) { $('sum').innerHTML = ''; el.innerHTML = '<p class="muted pad">Apro l’archivio…</p>'; return; }
    if (loadError) { $('sum').innerHTML = ''; el.innerHTML = '<p class="muted pad">Non riesco a leggere l’archivio. Ricarica la pagina.</p>'; return; }
    var list = jobs.filter(function (j) { return inFilter(j, filter) && matchJob(j); });
    var sum = '';
    if (filter === 'saldo' && list.length) {
      var t = 0; list.forEach(function (j) { t += daSaldare(j); });
      sum = '<p class="sumline">Da incassare in totale: <b>' + eur.format(t) + '</b></p>';
    }
    $('sum').innerHTML = sum;
    if (!jobs.length) {
      el.innerHTML = '<div class="empty-state"><p>Nessun veicolo in archivio. Registra la prima accettazione e comparirà qui, ricercabile per targa, telaio o proprietario.</p><button type="button" class="btn primary" data-act="new">' + ICON.plus + '<span>Nuova accettazione</span></button></div>';
      return;
    }
    if (!list.length) {
      var qq = q.trim(), looksPlate = /^[a-z0-9 ]{5,9}$/i.test(qq);
      el.innerHTML = '<div class="empty-state"><p>' + (qq ? 'Nessun risultato per “' + esc(qq) + '”.' : 'Nessuna scheda in questo elenco.') + '</p>' +
        '<button type="button" class="btn" data-act="new" data-plate="' + (looksPlate ? esc(qq.toUpperCase()) : '') + '">' + ICON.plus + '<span>Nuova accettazione' + (looksPlate ? ' con questa targa' : '') + '</span></button></div>';
      return;
    }
    el.innerHTML = list.map(cardHTML).join('');
  }

  function val(id) { var e = $(id); return e ? e.value.trim() : ''; }
  function lookup() {
    var el = $('lookup'); if (!el || view.edit) return;
    var p = norm(val('f-plate')), v = norm(val('f-vin'));
    var hits = jobs.filter(function (j) { return (p.length >= 3 && (j.plateCountry || 'I') === view.pc && norm(j.plate) === p) || (v.length >= 10 && norm(j.vin) === v); });
    if (!hits.length) { el.innerHTML = ''; return; }
    var j = hits[0];
    el.innerHTML = '<div class="found"><span><strong>Già in archivio</strong><br>' + esc(veic(j)) + ' · ' + esc(j.owner || '') + ' · ' + hits.length + (hits.length === 1 ? ' intervento' : ' interventi') + '</span>' +
      '<button type="button" class="btn" data-act="usefound" data-id="' + esc(j.id) + '">Usa i dati</button></div>';
  }
  function showErr(m) { var e = $('err'); e.textContent = m; e.hidden = false; e.scrollIntoView({ block: 'center' }); }
  async function submitForm() {
    var plate = val('f-plate').toUpperCase().replace(/\s+/g, view.pc === 'RSM' ? ' ' : '');
    var vin = val('f-vin').toUpperCase().replace(/\s+/g, '');
    var owner = val('f-owner');
    var cl = view.cl === 'azienda' ? 'azienda' : 'privato';
    var company = cl === 'azienda' ? { name: val('f-cname'), vat: val('f-cvat').replace(/\s+/g, ''), cf: val('f-ccf').toUpperCase().replace(/\s+/g, ''), addr: val('f-caddr'), sdi: val('f-csdi') } : {};
    if (!plate && !vin) return showErr('Inserisci la targa o il telaio.');
    if (cl === 'azienda') {
      if (!company.name) return showErr('Inserisci la ragione sociale.');
      if (!company.vat && !company.cf) return showErr('Inserisci la partita IVA (o il COE) oppure il codice fiscale.');
    } else if (!owner) return showErr('Inserisci il nome del proprietario.');
    var srv = [].slice.call(document.querySelectorAll('[data-act="svc"][aria-pressed="true"]')).map(function (b) { return b.dataset.v; });
    var f = {
      plate: plate, plateCountry: view.pc || 'I', vin: vin, make: val('f-make'), model: val('f-model'), km: val('f-km'), dueDate: val('f-due'),
      owner: owner, client: cl, company: company, phone: val('f-phone'), wa: $('f-wa').checked, services: srv,
      tyres: srv.indexOf('Gomme') >= 0 ? val('f-tyre') : '', request: val('f-req'), notes: val('f-notes')
    };
    if (view.edit) {
      Object.assign(cur, f); touch();
      await flush(); showDetail();
      return;
    }
    var now = Date.now();
    var job = Object.assign({
      id: uid(), createdAt: now, updatedAt: now, status: 'accettato', history: [{ s: 'accettato', t: now }],
      items: [], deposit: 0, paid: false, vatRate: settings.vat == null ? 22 : Number(settings.vat), vatIncl: true, warrantyMonths: settings.warranty == null ? 12 : Number(settings.warranty)
    }, f);
    try { await persist(job); } catch (e) { return showErr('Non sono riuscito a salvare. Riprova.'); }
    cur = job;
    showDetail({ hot: true, kind: 'accettato' });
  }

    }).join('') + '</div>';
    var act;

      act = '<p class="paidmsg">Incassato ' + eur.format(cur.paidAmount != null ? cur.paidAmount : tot) + ' il ' + fmtDateTime(cur.paidAt) + (cur.payMethod ? ' · ' + esc(cur.payMethod) : '') + '</p>' +

    var w = view.draft.workers || [];
    return (w.length
      ? '<ul class="wlist">' + w.map(function (n, i) {
        return '<li><span>' + esc(n) + '</span><button type="button" class="icon-btn" data-act="sdelworker" data-i="' + i + '" aria-label="Rimuovi ' + esc(n) + '">' + ICON.trash + '</button></li>';
      }).join('') + '</ul>'
      : '<p class="muted small">Nessun operaio in elenco.</p>') +
      '<div class="row addrow"><input id="s-wnew" type="text" autocomplete="off" placeholder="Nome operaio" aria-label="Nome nuovo operaio" data-f="wnew"><button type="button" class="btn" data-act="saddworker">Aggiungi</button></div>';
  }
  function renderSettings() {
    var d = view.draft;
    var logoPrev = d.logo ? '<img src="' + esc(d.logo) + '" alt="Logo attuale">' : '<span class="muted small">Nessun logo</span>';
    app.innerHTML =
      '<div class="bar"><button class="btn ghost" type="button" data-act="back">' + ICON.back + '<span>Archivio</span></button></div>' +
      '<h2 class="page-title">Impostazioni</h2>' +
      '<form id="sform" class="card" novalidate>' +
      '<div class="field"><label for="s-shop">Nome officina</label><input id="s-shop" type="text" autocomplete="off" placeholder="Es. Autofficina Rossi" value="' + esc(d.shop) + '"><span class="muted small">Compare in alto e firma i messaggi WhatsApp.</span></div>' +
      '<h3>Aspetto</h3>' +
      '<div class="field"><span class="lab">Colore principale</span><div class="swatches" id="swatches" role="group" aria-label="Colore principale">' + swatchesHTML() + '</div></div>' +
      '<div class="field"><span class="lab">Logo officina</span><div class="logo-row"><span class="logo big" id="logo-prev">' + logoPrev + '</span>' +
      '<div class="logo-btns"><input id="s-logo" class="vh" type="file" accept="image/*" data-f="logo"><label for="s-logo" class="btn">Carica logo</label><button type="button" class="btn ghost" data-act="rmlogo"' + (d.logo ? '' : ' disabled') + '>Rimuovi</button></div></div>' +
      '<p class="err" id="logo-err" role="alert" hidden></p></div>' +
      '<h3>Operai</h3><div id="sworkers">' + sworkersHTML() + '</div>' +
      '<h3>Telefono e garanzia</h3>' +
      '<div class="field"><label for="s-prefix">Prefisso telefonico predefinito</label><input id="s-prefix" type="text" inputmode="numeric" value="' + esc(d.prefix) + '"><span class="muted small">39 per l’Italia, 378 per San Marino. Serve ai numeri scritti senza prefisso: se scrivi +39 o +378 davanti al numero, il prefisso predefinito non si usa.</span></div>' +
      '<div class="field"><label for="s-warr">Garanzia predefinita sulle nuove schede</label><select id="s-warr">' +
      GARANZIE.map(function (g) { return '<option value="' + g.m + '"' + (Number(d.warranty) === g.m ? ' selected' : '') + '>' + g.l + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="s-vat">Aliquota IVA predefinita per le aziende</label><select id="s-vat">' +
      VATS.map(function (v) { return '<option value="' + v + '"' + (Number(d.vat == null ? 22 : d.vat) === v ? ' selected' : '') + '>' + (v ? v + '%' : 'Esente') + '</option>'; }).join('') + '</select><span class="muted small">22% Italia, 17% San Marino. Si cambia anche scheda per scheda.</span></div>' +
      '<p class="err" id="serr" role="alert" hidden></p>' +
      '<button class="btn primary block lg" type="submit">Salva impostazioni</button>' +
      '<p class="note">' + (mode === 'cloud' ? 'Le schede sono salvate nell’archivio online di questa pagina e si vedono da ogni dispositivo.' : 'Archivio solo su questo dispositivo: i dati restano in questo browser.') + ' Schede in archivio: ' + jobs.length + '.</p>' +
      '</form>';
  }
  async function handleLogo(file) {
    var er = $('logo-err'); if (er) er.hidden = true;
    try {
      view.draft.logo = await readLogo(file);
      $('logo-prev').innerHTML = '<img src="' + esc(view.draft.logo) + '" alt="Logo attuale">';
      var rb = document.querySelector('[data-act="rmlogo"]'); if (rb) rb.disabled = false;
    } catch (e) {
      if (er) { er.textContent = 'Non riesco a usare questa immagine. Prova con un PNG o JPG più piccolo.'; er.hidden = false; }
    }
  }
  function addSettingsWorker() {
    var inp = $('s-wnew'), n = inp.value.trim().replace(/\s+/g, ' ');
    if (!n) return;
    var w = view.draft.workers;
    if (!w.some(function (x) { return x.toLowerCase() === n.toLowerCase(); })) w.push(n);
    $('sworkers').innerHTML = sworkersHTML(); $('s-wnew').focus();
  }

  /* ---------- operai sulla scheda ---------- */
  function workersHTML() {
    var all = (settings.workers || []).slice(), sel = cur.workers || [];
    sel.forEach(function (n) { if (all.indexOf(n) < 0) all.push(n); });
    return (all.length
      ? '<div class="seg" role="group" aria-label="Operai che hanno lavorato">' + all.map(function (n) {
        return '<button type="button" data-act="worker" data-v="' + esc(n) + '" aria-pressed="' + (sel.indexOf(n) >= 0) + '">' + esc(n) + '</button>';
      }).join('') + '</div>'
      : '<p class="muted small">Nessun operaio in elenco. Aggiungi il primo qui sotto.</p>') +
      '<div class="row addrow"><input id="w-new" type="text" autocomplete="off" placeholder="Nome nuovo operaio" aria-label="Nome nuovo operaio" data-f="wnew"><button type="button" class="btn" data-act="addworker">Aggiungi</button></div>';
  }
  function refreshWorkers() {
    var v = $('w-new') ? $('w-new').value : '';
    $('workers').innerHTML = workersHTML();
    if (v) $('w-new').value = v;
  }
  function toggleWorker(n) {
    cur.workers = cur.workers || [];
    var i = cur.workers.indexOf(n);
    if (i >= 0) cur.workers.splice(i, 1); else cur.workers.push(n);
    touch(); queueSave(); refreshWorkers();
  }
  function addJobWorker() {
    var inp = $('w-new'), n = inp.value.trim().replace(/\s+/g, ' ');
    if (!n) return;
    settings.workers = settings.workers || [];
    var ex = settings.workers.filter(function (w) { return w.toLowerCase() === n.toLowerCase(); })[0];
    if (ex) n = ex; else { settings.workers.push(n); persistSettings().catch(function () {}); }
    cur.workers = cur.workers || [];
    if (cur.workers.indexOf(n) < 0) cur.workers.push(n);
    inp.value = ''; touch(); queueSave(); refreshWorkers();
    $('w-new').focus();
  }

  /* ---------- eventi ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t) return;
    act(t.dataset.act, t);
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'form') submitForm();
    else if (e.target.id === 'sform') {
      var d = view.draft;
      settings.shop = val('s-shop');
      settings.prefix = val('s-prefix').replace(/\D/g, '') || '39';
      settings.warranty = Number($('s-warr').value);
      settings.vat = Number($('s-vat').value);
      settings.accent = okHex(d.accent) ? d.accent : '#1B4FA3';
      settings.logo = d.logo || '';
      settings.workers = d.workers || [];
      persistSettings().then(function () { go({ n: 'list' }); }, function () {
        var er = $('serr'); er.textContent = 'Non sono riuscito a salvare le impostazioni. Il logo potrebbe essere troppo grande: riprova con uno più piccolo.'; er.hidden = false;
      });
    }
  });
  document.addEventListener('input', function (e) {
    var t = e.target, f = t.dataset ? t.dataset.f : null;
    if (!f) return;
    if (f === 'q') { q = t.value; updateResults(); }
    else if (f === 'plate' || f === 'vin') lookup();
    else if (f === 'deposit') { cur.deposit = parseAmount(t.value); afterMoney(); }
    else if (f === 'idesc') { cur.items[+t.dataset.i].desc = t.value; touch(); queueSave(); }
    else if (f === 'iamt') { cur.items[+t.dataset.i].amount = parseAmount(t.value); afterMoney(); }
    else if (f === 'invno') { cur.invoiceNo = t.value; touch(); queueSave(); }
    else if (f === 'wnote') { cur.warrantyNote = t.value; touch(); queueSave(); refreshWa(); }
    else if (f === 'watext') { view.waDirty = true; updateWaLink(); }
    else if (f === 'color') { view.draft.accent = t.value; applyBrand(t.value); markSwatches(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.f === 'wakind') { view.kind = t.value; view.waDirty = false; refreshWa(); }
    else if (t.dataset && t.dataset.f === 'mco') { view.co = t.value; view.sel = {}; view.mno = null; updateMonth(); }
    else if (t.dataset && t.dataset.f === 'mym') { if (/^\d{4}-\d{2}$/.test(t.value)) { view.ym = t.value; view.sel = {}; view.mno = null; updateMonth(); } }
    else if (t.dataset && t.dataset.f === 'msel') { view.sel[t.dataset.id] = t.checked; view.mno = null; updateMonth(); }
    else if (t.dataset && t.dataset.f === 'mno') { view.mno = t.value; updateMonth(); }
    else if (t.dataset && t.dataset.f === 'logo' && t.files && t.files[0]) { handleLogo(t.files[0]); t.value = ''; }
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (e.key === 'Enter' && t.dataset && t.dataset.f === 'wnew') {
      e.preventDefault(); act(t.id === 's-wnew' ? 'saddworker' : 'addworker', t);
    }
  });

  async function leaveDetail() {
    await flush();
    cur = null;
  }
  async function act(a, t) {
    var d = t.dataset;
    switch (a) {
      case 'settings': if (cur) await flush(); cur = null; go({ n: 'settings', draft: draftOf() }); break;
      case 'new': go({ n: 'form', prefill: { wa: true, plate: d.plate || '', client: d.cl || 'privato' } }); break;
      case 'client': setClient(d.v); break;
      case 'filter': filter = d.v; updateResults(); break;
      case 'open': openJob(d.id); break;
      case 'openother': await flush(); openJob(d.id); break;
      case 'back': applyBrand(settings.accent); await leaveDetail(); go({ n: 'list' }); break;
      case 'backdetail': showDetail(); break;
      case 'edit': go({ n: 'form', edit: true }); break;
      case 'svc':
        t.setAttribute('aria-pressed', t.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
        if (d.v === 'Gomme') $('tyre-field').hidden = t.getAttribute('aria-pressed') !== 'true';
        break;
      case 'usefound':
        var f = null; jobs.forEach(function (j) { if (j.id === d.id) f = j; });
        if (f) {
          view.pc = f.plateCountry || 'I';
          [].slice.call(document.querySelectorAll('[data-act="pcountry"]')).forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === view.pc ? 'true' : 'false'); });
          if (!val('f-plate')) $('f-plate').value = f.plate || '';
          if (!val('f-vin')) $('f-vin').value = f.vin || '';
          $('f-make').value = f.make || ''; $('f-model').value = f.model || '';
          $('f-owner').value = f.owner || ''; $('f-phone').value = f.phone || '';
          fillClient(f);
          $('f-wa').checked = f.wa !== false;
          $('lookup').innerHTML = '';
        }
        break;
      case 'pcountry':
        view.pc = d.v;
        [].slice.call(t.parentNode.children).forEach(function (b) { b.setAttribute('aria-pressed', b === t ? 'true' : 'false'); });
        lookup();
        break;
      case 'swatch': view.draft.accent = d.c; applyBrand(d.c); markSwatches(); break;
      case 'rmlogo':
        view.draft.logo = ''; $('logo-prev').innerHTML = '<span class="muted small">Nessun logo</span>'; t.disabled = true;
        break;
      case 'saddworker': addSettingsWorker(); break;
      case 'sdelworker': view.draft.workers.splice(+d.i, 1); $('sworkers').innerHTML = sworkersHTML(); break;
      case 'worker': toggleWorker(d.v); break;
      case 'addworker': addJobWorker(); break;
      case 'billing':
        cur.billing = d.v; touch(); queueSave();
        $('fatt').innerHTML = fattInner(); $('pay').innerHTML = payHTML(); refreshWa();
        break;
      case 'month': go({ n: 'month', co: '', ym: ymOf(Date.now()), sel: {}, mpay: '', mno: null, mmsg: '' }); break;
      case 'msel': break;
      case 'mpay': view.mpay = d.v; updateMonth(); break;
      case 'minv':
        var vno = val('m-no');
        await monthMark(function (c, now) { c.invoiced = true; c.invoicedAt = now; c.invoiceNo = vno; });
        break;
      case 'mundoinv': await monthMark(function (c) { c.invoiced = false; delete c.invoicedAt; }); break;
      case 'mpaid':
        if (!view.mpay) break;
        var pm = view.mpay;
        await monthMark(function (c, now) { var du = daSaldare(c); c.paid = true; c.paidAt = now; c.paidAmount = du; c.payMethod = pm; });
        break;
      case 'mundopay': await monthMark(function (c) { c.paid = false; delete c.paidAt; delete c.paidAmount; }); break;
      case 'msavepdf': await saveMonthPdf(); break;
      case 'maddjob':
        var cz = companies().filter(function (x) { return x.key === view.co; })[0];
        if (cz) go({ n: 'form', prefill: { wa: cz.wa !== false, client: 'azienda', company: clone(cz.company), owner: cz.owner, phone: cz.phone } });
        break;
      case 'vat': cur.vatRate = Number(d.r); afterMoney(); $('fatt').innerHTML = fattInner(); break;
      case 'vatincl': cur.vatIncl = d.v === '1'; afterMoney(); $('fatt').innerHTML = fattInner(); break;
      case 'invoiced':
        cur.invoiced = !cur.invoiced;
        if (cur.invoiced) cur.invoicedAt = Date.now(); else delete cur.invoicedAt;
        touch(); queueSave(); $('fatt').innerHTML = fattInner();
        break;
      case 'doc': view = { n: 'doc', id: cur.id }; window.scrollTo(0, 0); render(); break;
      case 'savepdf': await savePdf(); break;
      case 'readynotify':
        if (cur.status !== 'pronto' && cur.status !== 'consegnato') setStato('pronto');
        else { view.hot = true; view.kind = cur.status; view.waDirty = false; renderDetail(); }
        if ($('wa')) $('wa').scrollIntoView({ block: 'start' });
        break;
      case 'stato': setStato(d.v); break;
      case 'additem':
        cur.items.push({ desc: '', amount: 0 }); touch(); queueSave();
        $('items').innerHTML = itemsHTML();
        var inputs = $('items').querySelectorAll('.desc'); inputs[inputs.length - 1].focus();
        break;
      case 'delitem':
        cur.items.splice(+d.i, 1);
        $('items').innerHTML = itemsHTML(); afterMoney();
        break;
      case 'warranty':
        cur.warrantyMonths = Number(d.m);
        [].slice.call(t.parentNode.children).forEach(function (b) { b.setAttribute('aria-pressed', b === t ? 'true' : 'false'); });
        afterMoney();
        break;
      case 'method':
        cur.payMethod = d.v; touch(); queueSave();
        $('pay').innerHTML = payHTML(); refreshWa();
        break;
      case 'pay':
        if (!cur.payMethod) break;
        cur.paidAmount = daSaldare(cur); cur.paid = true; cur.paidAt = Date.now();
        touch(); queueSave(); afterMoney();
        break;
      case 'unpay':
        cur.paid = false; delete cur.paidAt; delete cur.paidAmount;
        touch(); queueSave(); afterMoney();
        break;
      case 'copywa':
        var ta = $('wa-text');
        try { await navigator.clipboard.writeText(ta.value); t.textContent = 'Copiato'; }
        catch (err) { ta.focus(); ta.select(); t.textContent = 'Testo selezionato'; }
        setTimeout(function () { t.textContent = 'Copia testo'; }, 1800);
        break;
      case 'askdel': view.confirmDel = true; $('danger').innerHTML = dangerHTML(); break;
      case 'canceldel': view.confirmDel = false; $('danger').innerHTML = dangerHTML(); break;
      case 'dodel':
        await flush();
        var id = cur.id; cur = null;
        try { await removeJob(id); } catch (err) { /* resta in archivio se la rimozione fallisce */ }
        go({ n: 'list' });
        break;
      case 'removedemo':
        t.disabled = true;
        var demo = jobs.filter(function (j) { return j.demo; });
        for (var i = 0; i < demo.length; i++) { try { await removeJob(demo[i].id); } catch (err) { break; } }
        if (view.n === 'list') updateResults();
        break;
    }
  }

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  init();
})();
</script>

</body>
</html>
